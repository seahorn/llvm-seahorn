# Lit configuration for the SeaHorn transform behavioral corpus.
#
# Tools are taken from the environment so the same corpus runs against any
# seaopt / LLVM build:
#   SEAOPT=./build/bin/seaopt OPT=opt-15 FILECHECK=FileCheck-15 \
#       lit -v test/sea_transforms
#
# Each test has three RUN lines:
#   1. %seaopt <pass> | %FileCheck %s            -- the SeaHorn invariant (CHECK)
#   2. %seaopt <pass> | %opt -passes=verify ...  -- output IR is well-formed
#   3. %opt -passes=<pass> | %FileCheck STOCK    -- stock diverges (non-vacuity)
# A required STOCK: line means the test fails loudly ("STOCK: expected string
# not found") if a future LLVM makes stock behave like SeaHorn.
import os
import lit.formats

config.name = "sea_transforms"
config.test_format = lit.formats.ShTest(execute_external=True)
config.suffixes = [".ll"]
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = config.test_source_root

seaopt = os.environ.get("SEAOPT", "seaopt")
opt = os.environ.get("OPT", "opt")
filecheck = os.environ.get("FILECHECK", "FileCheck")
loop_extract_driver = os.environ.get("SEA_LOOP_EXTRACT_DRIVER",
                                     "sea_loop_extract_driver")

# Order matters: longer keys first so %seaopt is substituted before %opt (so the
# trailing "opt" in a seaopt path is never re-touched), and the driver before
# %seaopt.
config.substitutions.append((r"%sea-loop-extract-driver", loop_extract_driver))
config.substitutions.append((r"%seaopt", seaopt))
config.substitutions.append((r"%FileCheck", filecheck))
config.substitutions.append((r"%opt", opt))
