import os
import lit.formats

# LLVM 16 upstream InstCombine regression tests, retargeted at SeaHorn's
# InstCombine (the new-PM `-passes=sea-instcombine`) to guard against
# core-functionality regressions while seahorn's Avoid* customizations are
# merged onto LLVM 16.
#
# seahorn's SeaInstCombine == upstream LLVM 16 InstCombine + Avoid* knobs.
# The Avoid* knobs default to SeaHorn behavior ON (so a bare
# `-passes=sea-instcombine` serves test/sea_transforms), so for THIS corpus
# they must be turned OFF to reproduce stock LLVM 16 `opt -passes=instcombine`.
# Disable them with:
#   -seaopt-instcombine-avoid-bv=0 -seaopt-instcombine-avoid-unsigned-icmp=0 \
#   -seaopt-instcombine-avoid-int-to-ptr=0 -seaopt-instcombine-avoid-aliasing=0
# (AvoidDisequalities already defaults OFF.) With Avoid* left ON, ~62 of these
# diverge from stock -- that divergence is exactly what test/sea_transforms
# checks; here we want stock equivalence.
#
#   # against seaopt (the real check): under the new PM, AA comes from the
#   # pipeline's AAManager (same as stock `-passes=instcombine`), so no
#   # -tbaa -basic-aa scheduling is needed; the avoid-*=0 flags neutralize
#   # SeaHorn's customizations:
#   INSTCOMBINE="./build/bin/seaopt -passes=sea-instcombine \
#     -seaopt-instcombine-avoid-bv=0 -seaopt-instcombine-avoid-unsigned-icmp=0 \
#     -seaopt-instcombine-avoid-int-to-ptr=0 -seaopt-instcombine-avoid-aliasing=0" \
#     FILECHECK=FileCheck lit -a test/sea_instcombine
#   # baseline self-check against stock LLVM 16:
#   INSTCOMBINE="opt-16 -passes=instcombine" FILECHECK=FileCheck \
#     lit -a test/sea_instcombine
#
# CURATION POLICY (keep the corpus mappable to a single instcombine run).
# %instcombine is one `seaopt -passes=sea-instcombine` invocation, so every
# test here must be a SINGLE-pass run. When importing more LLVM 16 tests,
# PRUNE any whose RUN line does not map to that, i.e. drop tests that use:
#   - multi-pass pipelines            (e.g. -passes=instcombine,simplifycfg,
#     -passes=instcombine,verify, or two RUN lines running different passes);
#   - typed-pointer mode              (-opaque-pointers / -opaque-pointers=0;
#     SeaInstCombine on LLVM 16 runs with opaque pointers by default);
#   - LLVM-named internal instcombine flags (-instcombine-*, e.g.
#     -instcombine-infinite-loop-threshold, -instcombine-max-iterations,
#     -instcombine-code-sinking); these are libLLVM cl::opts, some renamed to
#     sea-ic-* in SeaInstCombine, so they don't match opt-16 baseline 1:1.
# Benign and KEPT: output plumbing (-S, -o -, 2>&1), -data-layout=/-mtriple=
# (single run, different target -- cast.ll runs the pass twice for BE vs LE
# data layouts, both still single-pass), and -disable-* driver flags.
# As of the curation commit the corpus is 856 single-pass tests, 853 passing
# against both opt-16 and seaopt (3 target-gated unsupported, 0 failures).

config.name = "sea_instcombine"
config.test_format = lit.formats.ShTest(execute_external=True)
config.suffixes = [".ll"]
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = config.test_source_root

instcombine = os.environ.get("INSTCOMBINE", "seaopt -passes=sea-instcombine")
filecheck = os.environ.get("FILECHECK", "FileCheck")

# Order: %instcombine before %FileCheck; both are plain text substitutions.
config.substitutions.append((r"%instcombine", instcombine))
config.substitutions.append((r"%FileCheck", filecheck))
