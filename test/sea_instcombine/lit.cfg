import os
import lit.formats

# LLVM 16 upstream InstCombine regression tests, retargeted at SeaHorn's
# InstCombine (-sea-instcombine) to guard against core-functionality
# regressions while seahorn's Avoid* customizations are merged onto LLVM 16.
#
# seahorn's SeaInstCombine == upstream LLVM 16 InstCombine + Avoid* knobs that
# are OFF by default, so these tests must produce the same output as stock
# LLVM 16 `opt -passes=instcombine`. Run alongside test/sea_transforms (which
# exercises the Avoid* behavior).
#
#   # against seaopt (the real check, once SeaInstCombine is ported):
#   INSTCOMBINE="./build/bin/seaopt -sea-instcombine" FILECHECK=FileCheck \
#     lit -a test/sea_instcombine
#   # baseline self-check against stock LLVM 16:
#   INSTCOMBINE="opt-16 -passes=instcombine" FILECHECK=FileCheck \
#     lit -a test/sea_instcombine

config.name = "sea_instcombine"
config.test_format = lit.formats.ShTest(execute_external=True)
config.suffixes = [".ll"]
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = config.test_source_root

instcombine = os.environ.get("INSTCOMBINE", "seaopt -sea-instcombine")
filecheck = os.environ.get("FILECHECK", "FileCheck")

# Order: %instcombine before %FileCheck; both are plain text substitutions.
config.substitutions.append((r"%instcombine", instcombine))
config.substitutions.append((r"%FileCheck", filecheck))
